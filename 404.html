<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | KP Glass &amp; Aluminum</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050a14">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050a14; --card: #0a1628; --accent: #3b9eff; --text: #c2d0e4; --muted: #8a9bb5; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; text-align: center; }
  main { max-width: 480px; }
  .code { font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
  h1 { font-family: 'Outfit', sans-serif; font-size: clamp(1.8rem, 6vw, 2.4rem); color: #fff; margin-bottom: 1rem; font-weight: 600; }
  p { color: var(--muted); line-height: 1.7; margin-bottom: 2rem; overflow-wrap: break-word; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0.8rem 1.8rem; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; border-radius: 6px; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a href="/">Back to KP Glass &amp; Aluminum</a>
</main>
</body>
</html>
